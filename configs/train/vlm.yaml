meta:
  schema_version: 1
  experiment: vlm-release
  description: VLM training with prepared dataset caches.
model:
  name: vlm-release
  path: weights/vlm
  manifest: weights/vlm/gam_tokenizer_manifest.json
  type: groundingpi
  output_dir: outputs/vlm_train
training:
  swift_module: sft
  tuner_type: full
  torch_dtype: bfloat16
  attn_impl: flash_attn
  freeze_vit: false
  freeze_aligner: false
  freeze_llm: false
  max_length: 2048
  truncation_strategy: delete
  packing: true
  packing_length: 2048
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-05
  vit_lr: 1.0e-06
  aligner_lr: 1.0e-06
  warmup_ratio: 0.03
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs: '{"min_lr_rate":0.1}'
  weight_decay: 0.1
  max_grad_norm: 1.0
  gradient_checkpointing: false
  vit_gradient_checkpointing: true
  optimizer: multimodal
  loss_scale: ignore_empty_think
  add_non_thinking_prefix: true
  use_logits_to_keep: true
  save_strategy: steps
  save_steps: 100
  save_only_model: false
  logging_steps: 1
  deepspeed: zero1
  dataset_num_proc: 4
  packing_num_proc: 4
  dataloader_num_workers: 2
  split_dataset_ratio: 0
  seed: 42
  data_seed: 42
  ddp_timeout: 7200
  report_to: none
runtime:
  validation_profile: release
  expected_nodes: 1
  expected_gpus_per_node: 1
  expected_world_size: 1
  image_max_token_num: 1024
  external_plugin: train/vlm/plugin.py
datasets:
- name: spatial_train
  source_id: spatial_train
  path: data/spatial_train/cache/train
  manifest: data/spatial_train/cache/cache_manifest.json
  repeat: 1
