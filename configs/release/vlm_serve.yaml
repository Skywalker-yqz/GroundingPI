entrypoint: vlm-serve
args:
- --model
- weights/vlm
- --host
- 127.0.0.1
- --port
- '8000'
- --served-model-name
- groundingpi
- --device
- cuda:0
- --dtype
- bfloat16
- --attn-implementation
- flash_attention_2
- --non-thinking
- --max-images
- '1'
- --max-new-tokens
- '8192'
- --temperature
- '0'
- --top-p
- '1'
- --top-k
- '0'
- --repetition-penalty
- '1'
- --max-model-len
- '16384'
env:
  IMAGE_MAX_TOKEN_NUM: '512'
inputs:
- weights/vlm
outputs: []
