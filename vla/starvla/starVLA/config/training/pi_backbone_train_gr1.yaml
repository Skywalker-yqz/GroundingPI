run_id: debug
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
is_debug: false

framework:
  name: QwenPI            # QwenPI | WanPI | CosmosPI | VLMBackbonePI (see scripts/run_scripts_vlm_weight)
  qwenvl:
    base_vlm: /path/to/backbones/VLM/Qwen3-VL-4B
    vl_hidden_dim: 2048
    attn_implementation: flash_attention_2
    select_layer: 12

  action_model:
    action_model_type: DiT-L
    hidden_size: 1024     # 和 DiT 最后的 projection 对应，用于 ActionDecoder
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 29
    state_dim: 58
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 0
    use_vlln: true
    vl_self_attention_cfg:
      #qwenvl-2.5-3b
      attention_head_dim: 64
      #qwenvl-2.5-7b
      #attention_head_dim: 112
      #qwenvl-3-7b
      #attention_head_dim: 80
      dropout: 0.2
      final_dropout: true
      num_attention_heads: 32
      num_layers: 4
      positional_embeddings: null
    diffusion_model_cfg:    # DiT Transformers 的参数
      attention_head_dim: 48
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_attention_heads: 32
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /path/to/PhysicalAI-Robotics-GR00T-Teleop-Sim/LeRobot
    data_mix: gr1_multi_concat
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224, 224]
    # Full-data default. Percentage launchers set data_percent explicitly;
    # legacy 100-shot experiments must opt in with num_shot=100.
    num_shot: null

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-4
    qwen_vl_interface: 0.0
    action_model: 1.0e-04
  lr_scheduler_type: cosine
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  # reload_modules: 'action_model,layer_qformer' # warning: this may cause model to not converge
  # repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  weight_decay: 1e-5
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    # betas: [0.9, 0.95]
    betas: [0.95, 0.999]
    eps: 1.0e-08
    weight_decay: 1e-5
    #weight_decay: 1.0e-08

  # parameters to be determined
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
